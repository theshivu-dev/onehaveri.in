name: Apply transparent hero panel

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[hero transparency applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make hero copy panel transparent
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('partners.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'background: linear-gradient(135deg, rgba(248,241,227,.88), rgba(248,241,227,.68));',
              'background: rgba(248,241,227,.10);'
          )
          text = text.replace(
              'background: linear-gradient(135deg, rgba(248,241,227,.95), rgba(248,241,227,.78));',
              'background: rgba(248,241,227,.16);'
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add partners.js
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Make hero copy panel transparent [hero transparency applied]'
            git push
          fi
